<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — GoMesh Central Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-full flex items-center justify-center p-3 sm:p-4 font-sans antialiased bg-slate-950 selection:bg-indigo-500 selection:text-white">

  <!-- LOGIN CARD -->
  <div class="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl backdrop-blur-md mx-auto">
    <div class="flex items-center justify-center mb-5 sm:mb-6">
      <div class="h-11 w-11 sm:h-12 sm:w-12 rounded-xl bg-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-600/40 text-white font-black text-xl sm:text-2xl tracking-wider">
        M
      </div>
    </div>
    <div class="text-center mb-5 sm:mb-6">
      <h2 class="text-lg sm:text-xl font-bold text-white tracking-tight flex items-center justify-center gap-2">
        GoMesh <span class="text-xs px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 font-medium font-mono">{{APP_VERSION}}</span>
      </h2>
      <p class="text-xs text-slate-400 mt-1">Masuk untuk mengelola perangkat dan sesi remote</p>
    </div>

    <div id="login-error" class="hidden mb-4 p-3 rounded-lg bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs flex items-center gap-2">
      <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
      <span id="login-error-msg">Username atau password salah</span>
    </div>

    <!-- Step 1: Standard Username & Password Login Form -->
    <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Username</label>
        <input type="text" id="login-username" required placeholder="admin" autocomplete="username" class="w-full px-3.5 py-2.5 rounded-lg bg-slate-950 border border-slate-800 text-base sm:text-sm text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all font-mono" />
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Password</label>
        <input type="password" id="login-password" required placeholder="••••••••" autocomplete="current-password" class="w-full px-3.5 py-2.5 rounded-lg bg-slate-950 border border-slate-800 text-base sm:text-sm text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all font-mono" />
      </div>
      <button type="submit" id="login-submit-btn" class="w-full mt-2 py-3 sm:py-2.5 px-4 rounded-lg bg-indigo-600 hover:bg-indigo-500 font-semibold text-sm text-white shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center gap-2 min-h-[44px]">
        <span>Masuk ke Console</span>
      </button>
    </form>

    <!-- Step 2: 2FA Verification Form -->
    <form id="login-2fa-form" onsubmit="handleLogin2FA(event)" class="space-y-4 hidden">
      <div class="p-3 rounded-xl bg-amber-500/10 border border-amber-500/20 text-center">
        <div class="w-10 h-10 rounded-full bg-amber-500/20 text-amber-400 mx-auto flex items-center justify-center mb-2">
          <i data-lucide="shield-alert" class="w-5 h-5"></i>
        </div>
        <h3 class="text-sm font-bold text-white">Verifikasi Dua Langkah (2FA)</h3>
        <p class="text-[11px] text-slate-400 mt-1">Masukkan 6 digit kode autentikasi dari Google Authenticator atau aplikasi TOTP Anda.</p>
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1 text-center">Kode Verifikasi 6 Digit</label>
        <input type="text" id="login-2fa-code" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" placeholder="000000" autocomplete="one-time-code" class="w-full text-center tracking-[0.4em] text-2xl font-bold font-mono py-2.5 px-4 rounded-lg bg-slate-950 border border-slate-800 text-amber-400 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all placeholder:text-slate-700" />
      </div>

      <button type="submit" id="login-2fa-submit-btn" class="w-full py-3 sm:py-2.5 px-4 rounded-lg bg-amber-600 hover:bg-amber-500 font-semibold text-sm text-white shadow-lg shadow-amber-600/30 transition-all flex items-center justify-center gap-2 min-h-[44px]">
        <span>Verifikasi & Masuk</span>
      </button>

      <button type="button" onclick="cancel2FALogin()" class="w-full py-2.5 text-xs font-semibold text-slate-400 hover:text-white transition-colors text-center block">
        ← Kembali ke Login
      </button>
    </form>
  </div>

  <!-- TOAST CONTAINER -->
  <div id="toast-container" class="fixed top-3 right-3 left-3 sm:left-auto sm:right-5 z-[9999] flex flex-col gap-2 pointer-events-none max-w-none sm:max-w-sm sm:w-full"></div>

  <script src="/static/js/utils.js"></script>
  <script>
    let pending2FAToken = null;

    async function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById('login-username').value;
      const pass = document.getElementById('login-password').value;
      const errorBanner = document.getElementById('login-error');
      const submitBtn = document.getElementById('login-submit-btn');

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Memverifikasi...';
      lucide.createIcons();

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: user, password: pass })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          errorBanner.classList.add('hidden');
          showToast('Login berhasil! Mengalihkan ke dashboard...', 'success');
          setTimeout(() => {
            window.location.href = '/';
          }, 300);
        } else if (data.requires_2fa) {
          errorBanner.classList.add('hidden');
          pending2FAToken = data.temp_token;
          document.getElementById('login-form').classList.add('hidden');
          document.getElementById('login-2fa-form').classList.remove('hidden');
          document.getElementById('login-2fa-code').value = '';
          document.getElementById('login-2fa-code').focus();
          showToast('Masukkan kode autentikasi 2FA Anda', 'info');
          lucide.createIcons();
        } else {
          errorBanner.classList.remove('hidden');
          document.getElementById('login-error-msg').innerText = data.error || 'Username atau password salah';
          showToast(data.error || 'Login gagal', 'error');
        }
      } catch (err) {
        errorBanner.classList.remove('hidden');
        document.getElementById('login-error-msg').innerText = 'Koneksi ke server gagal';
        showToast('Koneksi ke server gagal', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Masuk ke Console</span>';
        lucide.createIcons();
      }
    }

    async function handleLogin2FA(e) {
      e.preventDefault();
      const code = document.getElementById('login-2fa-code').value.trim();
      const errorBanner = document.getElementById('login-error');
      const submitBtn = document.getElementById('login-2fa-submit-btn');

      if (!code || code.length !== 6) {
        showToast('Kode 2FA harus berupa 6 digit angka', 'warning');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Memvalidasi OTP...';
      lucide.createIcons();

      try {
        const res = await fetch('/api/auth/login/2fa', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ temp_token: pending2FAToken, code: code })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          errorBanner.classList.add('hidden');
          showToast('Autentikasi 2FA berhasil! Mengalihkan...', 'success');
          setTimeout(() => {
            window.location.href = '/';
          }, 300);
        } else {
          errorBanner.classList.remove('hidden');
          document.getElementById('login-error-msg').innerText = data.error || 'Kode 2FA salah atau kedaluwarsa';
          showToast(data.error || 'Kode 2FA tidak valid', 'error');
        }
      } catch (err) {
        errorBanner.classList.remove('hidden');
        document.getElementById('login-error-msg').innerText = 'Gagal memverifikasi 2FA';
        showToast('Gagal memverifikasi 2FA', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Verifikasi & Masuk</span>';
        lucide.createIcons();
      }
    }

    function cancel2FALogin() {
      document.getElementById('login-2fa-form').classList.add('hidden');
      document.getElementById('login-form').classList.remove('hidden');
      document.getElementById('login-error').classList.add('hidden');
      pending2FAToken = null;
      lucide.createIcons();
    }

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      document.getElementById('login-username')?.focus();
    });
  </script>
</body>
</html>
